name: Aegis CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: test_db, POSTGRES_USER: test, POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d test_db" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: 'pip', cache-dependency-path: backend/requirements.txt }
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint
        working-directory: backend
        run: ruff check app/ || true
      - name: Test
        working-directory: backend
        env: { POSTGRES_HOST: localhost, REDIS_HOST: localhost, OPENAI_API_KEY: test-key }
        run: pytest tests/ -v --tb=short

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        uses: docker/build-push-action@v5
        with: { context: ./backend, push: false, tags: aegis-backend:latest }
      - name: Build frontend
        uses: docker/build-push-action@v5
        with: { context: ./frontend, push: false, tags: aegis-frontend:latest }
