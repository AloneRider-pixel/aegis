name: One-time Aegis runtime hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch runtime safety defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path('backend/app/config.py')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace('debug: bool = True', 'debug: bool = False', 1)
          config_path.write_text(config, encoding='utf-8')

          main_path = Path('backend/app/main.py')
          main = main_path.read_text(encoding='utf-8')
          old_cors = '    allow_origins=["*"],'
          new_cors = '    allow_origins=[origin.strip() for origin in settings.cors_allowed_origins.split(",") if origin.strip()],'
          if old_cors in main:
              main = main.replace(old_cors, new_cors, 1)

          old_execute = '''    incident = await get_incident(db, incident_id)\n    if not incident:\n        raise HTTPException(status_code=404, detail="Incident not found")\n\n    remediation = incident.recommended_remediation'''
          new_execute = '''    if user.get("role") not in ("incident_manager", "admin"):\n        raise HTTPException(status_code=403, detail="Insufficient permissions to execute remediation")\n\n    incident = await get_incident(db, incident_id)\n    if not incident:\n        raise HTTPException(status_code=404, detail="Incident not found")\n\n    if incident.status.value != "remediating":\n        raise HTTPException(status_code=409, detail="Remediation must be approved before execution")\n\n    remediation = incident.recommended_remediation'''
          if old_execute in main:
              main = main.replace(old_execute, new_execute, 1)
          main_path.write_text(main, encoding='utf-8')

          app_path = Path('frontend/src/App.jsx')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("useState('admin123')", "useState('')", 1)
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile backend/app/config.py backend/app/main.py

      - name: Validate frontend build
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/config.py backend/app/main.py frontend/src/App.jsx
          if git diff --cached --quiet; then
            echo "No hardening changes needed"
            exit 0
          fi
          git commit -m "security: enforce safe runtime defaults and remediation authorization"
          git push
