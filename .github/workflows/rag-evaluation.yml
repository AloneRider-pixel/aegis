name: Synthetic RAG contract evaluation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-rag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Test evaluator
        run: python -m unittest discover -s evaluation/rag -p 'test_*.py' -v
      - name: Evaluate synthetic baseline and reject regressions
        run: python evaluation/rag/rag_eval.py --output rag-report.json
      - name: Publish regression report in job summary
        if: always()
        run: |
          echo '## Synthetic RAG contract report' >> "$GITHUB_STEP_SUMMARY"
          echo 'Offline substring retrieval and exact-quote support only. No LLM quality claim.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f rag-report.json ]; then cat rag-report.json >> "$GITHUB_STEP_SUMMARY"; else echo '{"error":"report not produced"}' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
